    :root {

      --gold: #c9a96e;
    }

    }

    .heading-serif {
      font-family: 'Playfair Display', Georgia, serif;
      letter-spacing: -0.02em;
    }

    .perfume-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid #d5d8e0;
    }

    .perfume-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
      border-color: var(--gold);
    }

    .perfume-img {
      background: #f5f6fa;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .perfume-card:hover .perfume-img {
      transform: scale(1.03);
    }

    .section-header {
      letter-spacing: -0.03em;
    }

    .navy-color {
      color: var(--navy);
    }

    .catalog-container {
      background: var(--cream);
    }

    .meta {
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
    }
    #viewer.open { display: flex; }
    #viewer .viewer-container {
      display: flex;
      width: 100%;
      height: 100%;
    }
    #viewer .viewer-image-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-width: 0;
    }
    #viewer .viewer-image-area img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }
    #viewer .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #viewer .nav-arrow:hover { background: rgba(255,255,255,0.3); }
    #viewer .nav-arrow.prev { left: 20px; }
    #viewer .nav-arrow.next { right: 20px; }
    #viewer .viewer-sidebar {
      width: 420px;
      background: white;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    #viewer .viewer-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }
    #viewer .viewer-close:hover { background: rgba(255,255,255,0.3); }
    #viewer .viewer-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      letter-spacing: 2px;
    }

    .note-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin: 2px;
    }

    .price-badge {
      background: linear-gradient(135deg, #2c3e6b, #1a2a4a);
      color: white;
      font-weight: 700;
      padding: 2px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      display: inline-block;
    }

    @media (max-width: 768px) {
      #viewer .viewer-container { flex-direction: column; }
      #viewer .viewer-sidebar { width: 100%; height: 50%; padding: 24px 20px; }
      #viewer .viewer-image-area { height: 50%; }
      #viewer .nav-arrow { width: 36px; height: 36px; font-size: 16px; }
      #viewer .nav-arrow.prev { left: 10px; }
      #viewer .nav-arrow.next { right: 10px; }

</head>

    function createCard(p, index) {
      const card = document.createElement('div');

      const imgSrc = p.file || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjVmNmZhIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4YjlhYjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5JbWFnZW0gZGEgRnJhZ3JhbmNpY2E8L3RleHQ+PC9zdmc+';
      card.innerHTML = `
        <div class="relative flex-1 aspect-[3/4] bg-[#f5f6fa]">
          <img src="${imgSrc}" alt="${p.name}" class="perfume-img absolute inset-0 w-full h-full object-contain p-6" onerror="this.style.background='#f5f6fa'; this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjVmNmZhIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4YjlhYjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5JbWFnZW0gZGEgRnJhZ3JhbmNpY2E8L3RleHQ+PC9zdmc+">
          <div class="absolute top-3 right-3 flex flex-col gap-1 items-end">
            <span class="meta px-2.5 py-0.5 bg-white/90 backdrop-blur rounded-full text-[#2c3e6b] font-medium shadow-sm">${p.tag.toUpperCase()}</span>
          </div>
        </div>
        <div class="p-4 flex flex-col flex-1">
          <div class="flex items-center justify-between mb-1">
            <div class="text-xs text-[#8a9ab0] font-medium">${p.marca}</div>
            <span class="price-badge">${p.price}</span>
          </div>
          <div class="font-semibold text-[#2c2a25] tracking-tight leading-tight" style="font-size:0.82rem">${p.name}</div>
          ${p.contratipo ? `<div class="text-[10px] text-[#5a6a8a] italic mt-0.5 mb-1.5">${p.contratipo}</div>` : '<div class="mb-2"></div>'}
          <div class="flex flex-wrap gap-1 mb-2">
            ${p.top ? p.top.split(', ').slice(0,2).map(n => `<span class="note-badge bg-[#f5f6fa] text-[#8a9ab0] border border-[#d5d8e0]">${n}</span>`).join('') : ''}
          </div>
          <p class="text-sm text-[#5c5a52] line-clamp-2 flex-1">${p.desc}</p>
          <div class="mt-3 flex items-center text-xs text-[#5a6a8a]">
            <span class="flex-1">TULIPA ESSÊNCIAS</span>
            <span class="group-hover:text-[#2c3e6b] transition-colors flex items-center">Ampliar <i class="fa-solid fa-expand ml-1 text-[9px]"></i></span>
          </div>
        </div>
      `;
      card.onclick = () => openViewer(index);
      return card;
    }

    function renderPerfumes(arr) {
      filteredPerfumes = arr;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      arr.forEach((p, i) => grid.appendChild(createCard(p, i)));
    }

    function filterPerfumes() {
      const term = document.getElementById('search').value.toLowerCase().trim();
      let filtered = perfumes;
      if (currentTag !== 'all') filtered = filtered.filter(p => p.tag === currentTag);
      if (term) filtered = filtered.filter(p => p.name.toLowerCase().includes(term) || p.marca.toLowerCase().includes(term) || p.contratipo.toLowerCase().includes(term));
      renderPerfumes(filtered);
    }

    let currentTag = 'all';
    function filterByTag(tag) {
      currentTag = tag;
      document.querySelectorAll('.flex.gap-2 button').forEach(btn => {
        btn.classList.remove('bg-[#2c3e6b]', 'text-white');
        btn.classList.add('border', 'border-[#c9a96e]');
      });
      const btnMap = { 'all': 'Todos', 'amadeirado': 'Amadeirado', 'aromatico': 'Aromático', 'citrico': 'Cítrico', 'oriental': 'Oriental', 'fresco': 'Fresco' };
      document.querySelectorAll('.flex.gap-2 button').forEach(btn => {
        if (btn.textContent.trim() === btnMap[tag]) {
          btn.classList.add('bg-[#2c3e6b]', 'text-white');
          btn.classList.remove('border', 'border-[#c9a96e]');
        }
      });
      filterPerfumes();
    }

    function openViewer(index) {
      currentIndex = index;
      updateViewer();
      document.getElementById('viewer').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeViewer() {
      document.getElementById('viewer').classList.remove('open');
      document.body.style.overflow = '';
    }

    function navigatePerfume(dir) {
      currentIndex = (currentIndex + dir + filteredPerfumes.length) % filteredPerfumes.length;
      updateViewer();
    }

    function updateViewer() {
      const p = filteredPerfumes[currentIndex];
      document.getElementById('viewer-img').src = p.file || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjVmNmZhIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4YjlhYjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5JbWFnZW0gZGEgRnJhZ3JhbmNpY2E8L3RleHQ+PC9zdmc+';
      document.getElementById('viewer-img').alt = p.name;
      document.getElementById('viewer-name').textContent = p.name;
      document.getElementById('viewer-contratipo').textContent = p.contratipo || '';
      document.getElementById('viewer-marca').textContent = p.marca;
      document.getElementById('viewer-price').textContent = p.price;
      document.getElementById('viewer-desc').textContent = p.desc;
      document.getElementById('viewer-tag').textContent = 'PERFUMARIA • ' + p.tag.toUpperCase();
      document.getElementById('viewer-counter').textContent = (currentIndex + 1) + ' / ' + filteredPerfumes.length;

      const notesContainer = document.getElementById('viewer-notes');
      notesContainer.innerHTML = '';
      const noteCategories = [];
      if (p.top) noteCategories.push({ label: 'Topo', notes: p.top, color: 'bg-blue-100 text-blue-700 border-blue-200' });
      if (p.heart) noteCategories.push({ label: 'Coração', notes: p.heart, color: 'bg-indigo-100 text-indigo-700 border-indigo-200' });
      if (p.base) noteCategories.push({ label: 'Fundo', notes: p.base, color: 'bg-purple-100 text-purple-700 border-purple-200' });

      noteCategories.forEach(cat => {
        const wrapper = document.createElement('div');
        wrapper.className = 'mb-3';
        wrapper.innerHTML = `<div class="text-xs font-medium text-[#8a9ab0] mb-1">${cat.label}</div><div class="flex flex-wrap gap-1">`;
        cat.notes.split(', ').forEach(n => {
          wrapper.innerHTML += `<span class="note-badge ${cat.color}">${n}</span>`;
        });
        wrapper.innerHTML += `</div>`;
        notesContainer.appendChild(wrapper);
      });
    }

    function sharePerfume() {
      const p = filteredPerfumes[currentIndex];
      if (!p) return;
      const text = `✨ ${p.name} — ${p.marca}\n${p.price}\n${p.desc}`;
      if (navigator.share) {
        navigator.share({ title: p.name, text });
      } else {
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.querySelector('.viewer-sidebar button');
          const orig = btn.innerHTML;
          btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i>Copiado!';
          setTimeout(() => { btn.innerHTML = orig; }, 1400);
        });
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === '/' && document.activeElement.tagName === 'BODY') {
        e.preventDefault();
        document.getElementById('search').focus();
      }
      if (e.key === 'Escape') {
        if (document.getElementById('viewer').classList.contains('open')) closeViewer();
      }
      if (e.key === 'ArrowLeft') {
        if (document.getElementById('viewer').classList.contains('open')) navigatePerfume(-1);
      }
      if (e.key === 'ArrowRight') {
        if (document.getElementById('viewer').classList.contains('open')) navigatePerfume(1);
      }
    });

    function initCatalog() {
      renderPerfumes(perfumes);
      const firstBtn = document.querySelector('.flex.gap-2 button');
      if (firstBtn) firstBtn.classList.add('bg-[#2c3e6b]', 'text-white');
      console.log('%c[Catálogo Perfumaria Masculina] ' + perfumes.length + ' essências carregadas.', 'color:#2c3e6b');
    }

    window.onload = initCatalog;
